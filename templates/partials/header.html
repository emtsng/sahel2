{% load static %}
<header id="header">
    <div class="wpo-site-header wpo-header-style-1">
        <nav class="navigation navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-lg-4 col-md-3 col-3 d-lg-none dl-block">
                        <div class="mobail-menu">
                            <button type="button" class="navbar-toggler open-btn">
                                <span class="sr-only">Toggle navigation</span>
                                <span class="icon-bar first-angle"></span>
                                <span class="icon-bar middle-angle"></span>
                                <span class="icon-bar last-angle"></span>
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-8 col-md-6 col-6">
                        <div class="navbar-wrap">
                            <div class="navbar-header">
                                <a class="navbar-brand logo" href="{% url 'core:home' %}">
                                    <img src="{% static 'assets/images/logo.svg' %}" alt="{{ site_name }}">
                                </a>
                            </div>
                            <div id="navbar" class="collapse navbar-collapse navigation-holder">
                                <button class="menu-close"><i class="ti-close"></i></button>
                                <ul class="nav navbar-nav mb-2 mb-lg-0">
                                    <li>
                                        <a href="{% url 'core:home' %}" {% if nav_section == 'home' %}class="active"{% endif %}>Home</a>
                                    </li>
                                    <li class="menu-item-has-children">
                                        <a href="{% url 'core:about' %}" {% if nav_section == 'about' or nav_section == 'team' %}class="active"{% endif %}>About</a>
                                        <ul class="sub-menu">
                                            <li><a href="{% url 'core:about' %}" {% if nav_section == 'about' %}class="active"{% endif %}>About Us</a></li>
                                            <li><a href="{% url 'core:team' %}" {% if nav_section == 'team' %}class="active"{% endif %}>Our Team</a></li>
                                        </ul>
                                    </li>
                                    <li>
                                        <a href="{% url 'services:list' %}" {% if nav_section == 'services' %}class="active"{% endif %}>Services</a>
                                    </li>
                                    <li>
                                        <a href="{% url 'projects:list' %}" {% if nav_section == 'projects' %}class="active"{% endif %}>Projects</a>
                                    </li>
                                    <li>
                                        <a href="{% url 'core:contact' %}" {% if nav_section == 'contact' %}class="active"{% endif %}>Contact</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-3 col-3">
                        <div class="header-right">
                            <div class="get-btn">
                                <a class="theme-btn" href="{% url 'core:contact' %}">Get a Free Quote</a>
                            </div>
                            <div class="header-search-form-wrapper">
                                <div class="cart-search-contact">
                                    <button class="search-toggle-btn" type="button"><i class="fi flaticon-search"></i></button>
                                    <div class="header-search-form">
                                        <form action="#" method="get">
                                            <div>
                                                <input type="text" class="form-control" name="q" placeholder="Search here...">
                                                <button type="submit"><i class="fi flaticon-search"></i></button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>
